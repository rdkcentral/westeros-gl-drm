name: tests-trigger

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
  push:
    branches: [main, develop, 'sprint/**', 'release/**']
  pull_request:
    branches: [main, develop, 'sprint/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l1-tests:
    name: L1 tests (Westeros GL DRM)
    uses: ./.github/workflows/L1-tests.yml
    with:
      caller_source: local